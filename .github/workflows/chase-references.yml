name: Chase references

# Every weekday at 07:00 UTC (8am UK in summer, 7am in winter), ask the app to
# email referees who haven't replied and flag overdue ones.
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  chase:
    runs-on: ubuntu-latest
    steps:
      - name: Run reference chase
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CHASE_KEY: ${{ secrets.CHASE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$APP_URL/api/chaseReferences" \
            -H "x-chase-key: $CHASE_KEY" -H "Content-Length: 0"
